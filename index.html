<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
</head>

<body>
    <div class="" style="background-image: url(./img/BG\ Hero.png);">
        <header class="absolute inset-x-0 top-0 z-50 py-4 lg:py-5">
            <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 lg:px-8">
                <div class="flex lg:flex-1">
                    <a href="#" class="-m-1.5 p-1.5">
                        <span class="sr-only">Your Company</span>
                        <h3 class="font-chronicle font-bold text-3xl text-white">MNTN</h3>
                    </a>
                </div>
                <div class="lg:hidden">
                    <button id="open-menu" type="button"
                        class="-m-2.5 flex items-center justify-center rounded-lg p-2.5 text-gray-700">
                        <span class="sr-only">Open main menu</span>
                        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true">
                            <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
                <div class="hidden lg:flex lg:gap-x-8">
                    <a href="#" class="font-gilroy text-[18px] font-bold text-white">Equipment</a>
                    <a href="#" class="font-gilroy text-[18px] font-bold text-white">About us</a>
                    <a href="#" class="font-gilroy text-[18px] font-bold text-white">Blog</a>
                </div>
                <div class="hidden lg:flex lg:flex-1 lg:items-center lg:justify-end lg:gap-x-3">
                    <a href="#" class="w-5 h-5"><img src="./img/cart.svg" alt=""></a>
                    <a href="#" class="font-gilroy text-[18px] font-bold text-white">Account</a>
                </div>
            </nav>
            <div id="mobile-menu" class="lg:hidden" role="dialog" aria-modal="true">
                <div id="backdrop" class="fixed inset-0 z-50"></div>
                <div
                    class="fixed inset-0 z-50 w-full bg-white sm:left-auto sm:right-0 sm:max-w-sm sm:ring-1 sm:ring-gray-900/10">
                    <div class="flex items-center justify-between px-6 py-4">
                        <a href="#" class="-m-1.5 p-1.5">
                            <span class="sr-only">Your Company</span>
                            <h3 class="font-chronicle font-bold text-3xl text-white">MNTN</h3>
                        </a>
                        <button id="close-menu" type="button"
                            class="-m-2.5 flex items-center justify-center rounded-lg p-2.5 text-gray-700">
                            <span class="sr-only">Close menu</span>
                            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">
                                <path d="M19 5L4.99998 19M5.00001 5L19 19" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                    <div class="divide-y divide-gray-900/10 px-6">
                        <div class="space-y-0.5 py-5">
                            <a href="#" class="font-gilroy text-[18px] font-bold text-white">Equipment</a>
                            <a href="#" class="font-gilroy text-[18px] font-bold text-white">About us</a>
                            <a href="#" class="font-gilroy text-[18px] font-bold text-white">Blog</a>
                        </div>
                        <div class="space-y-3 py-6">
                            <a href="#" class="w-5 h-5"><img src="./img/cart.svg" alt=""></a>
                            <a href="#" class="font-gilroy text-[18px] font-bold text-white">Account</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="relative isolate overflow-hidden pt-12 lg:pt-16">
            <div aria-hidden="true"
                class="absolute -top-[40rem] left-1/2 -z-10 h-[80rem] w-[80rem] -translate-x-1/2 rounded-full bg-hero-grid bg-[length:70px_70px] mask-image-radial-gradient">
            </div>
            <div class="mx-auto max-w-[950px] px-6 lg:px-8">
                <div class="py-24 sm:py-32 lg:pb-0 max-w-[600px] mx-auto">
                    <div class="flex items-center gap-3 justify-start">
                        <img src="./img/Rectangle 2.1.svg" alt="" class="">
                        <p class="font-gilroy font-extrabold text-[18px] text-[#FBD784] tracking-[6px]">A HIKING GUIDE</p>
                    </div>
                    <h1 class="text-pretty text-left text-[88px] font-chronicle tracking-tight text-white sm:text-6xl">
                        Be prepared for the Mountains and beyond!
                    </h1>
                </div>
            </div>
        </div>
        <div class="min-h-screen" style="background-image: url(./img/MG.png);">

        </div>
        <div class="min-h-screen" style="background-image: url(./img/VG.png);">

        </div>
    </div>
</body>

</html>
